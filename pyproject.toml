[project]
name = "code-patcher"
version = "0.1.0"
description = "Automated code patching and benchmarking agent"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [

    "langgraph-checkpoint-sqlite",
    # Agent / orchestration
    "langgraph>=0.6.0",
    "langchain>=1.0.0",

    # LLM providers
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.2.0",

    # Configuration / environment
    "python-dotenv>=1.0.0",

    # HTTP / API layer — useful when we add FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Data validation / structured LLM output
    "pydantic>=2.0.0",

    # Git / repository manipulation
    "gitpython>=3.1.0",

    # Requests
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "grandalf",
]
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "shared*", "harness*"]
exclude = ["results*"]